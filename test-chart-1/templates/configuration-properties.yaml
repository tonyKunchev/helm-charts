apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "test-chart-1.fullname.config.properties" . }}
  namespace: {{ include "test-chart-1.namespace" . }}
  labels:
    {{- include "test-chart-1.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
data:
  {{- if .Values.configuration.properties }}
    {{- range $key, $val := .Values.configuration.properties -}}
      {{- if ne $val nil }}
        {{- $key | nindent 2 }}: {{ tpl ($val | toString) $ | quote }}
      {{- end }}
    {{- end -}}
  {{- end -}}
