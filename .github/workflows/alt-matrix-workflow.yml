name: CI - Pull Request
run-name: CI - Pull Request pipeline triggered by ${{ github.actor }}

on:
  # A pull request is opened, reopened, or when the head branch of the pull request is updated.
  pull_request:
    # Ignore when updating only documentation files.
    paths-ignore:
      - '**.md'
      - '**.gotmpl'

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Verify Changed Files
        id: verify-changed-files
        uses: tj-actions/verify-changed-files@a1c6acee9df209257a246f2cc6ae8cb6581c1edf # v20.0.4

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

  lint-test:
      needs: [prepare]
      runs-on: ubuntu-latest
      env:
        CHANGED_FILES: (${{ needs.verify-changed-files.outputs.changed_files }})
      strategy:
        matrix:
          chart:
            - test-chart-1
            - test-chart-2
      steps:
        - name: ${{ matrix.chart }} - Helm lint & render check
          if: contains(needs.verify-changed-files.outputs.changed_files, '${{ matrix.chart }}')
          run: |
            helm lint --strict .
            helm template . > output.yaml --debug
