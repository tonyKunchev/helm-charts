name: Notifications

on:
  release:
    types:
      - published

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:

      - name: Parse the release name
        id: tag_parser
        env:
          RELEASE_TAG: "${{ github.event.release.name }}"
        run:
          echo "name=${RELEASE_TAG%-*}" >> $GITHUB_OUTPUT
          echo "version=${RELEASE_TAG##*-}" >> $GITHUB_OUTPUT

      - name: Send custom event details to a Slack workflow
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          payload: |
            status: "${{ job.status }}"
            name: "${{ steps.tag_parser.outputs.name }}"
            release: "${{ steps.tag_parser.outputs.version }}"
            user: "${{ github.actor }}"
            user_url: "${{ github.event.release.author.html_url }}"
            repository: "https://github.com/${{ github.repository }}"
            tag_link: "${{ github.event.release.html_url }}"
            published_at: "${{ github.event.release.published_at }}"
